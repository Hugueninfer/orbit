name: Verify Orbit
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: orbit-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit-test
          POSTGRES_DB: orbit_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_MODE: demo
      DATABASE_URL: postgresql+psycopg://orbit:orbit-test@localhost:55432/orbit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.15'
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.14'
      - run: uv sync --frozen --python "${{ steps.python.outputs.python-path }}"
        working-directory: backend
      - run: uv run ruff check app tests && uv run mypy app
        working-directory: backend
      - run: uv run alembic upgrade head && uv run pytest -q
        working-directory: backend
      - run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: uv export --frozen --no-dev --no-emit-project --output-file requirements-audit.txt > /dev/null && uv tool run pip-audit -r requirements-audit.txt --no-deps
        working-directory: backend
      - run: ./scripts/generate-api.sh && git diff --exit-code -- backend/openapi.json web/src/generated/api.ts
      - run: cp .env.example .env && docker compose up -d --build --wait
      - name: Start isolated personal login test installation
        env:
          APP_MODE: personal
          PORT: '8082'
          POSTGRES_PASSWORD: orbit-ci-personal
          ALLOWED_ORIGINS: http://127.0.0.1:8082
          SESSION_COOKIE_SECURE: 'false'
        run: |
          docker compose -p orbit-personal-ci up -d --no-build --wait
          docker compose -p orbit-personal-ci exec -T app python - <<'PY'
          from app.accounts import provision
          from app.db import SessionLocal
          with SessionLocal.begin() as db:
              provision(db, "browser@example.com", "Orbit browser test password 2026")
          PY
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
        env:
          ORBIT_BASE_URL: http://127.0.0.1:8080
          ORBIT_PERSONAL_URL: http://127.0.0.1:8082
      - name: Preserve the tested release image
        if: github.event_name == 'release'
        run: docker save orbit:local | gzip > orbit-tested.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'release'
        with:
          name: orbit-tested-image
          path: orbit-tested.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: web/test-results
          retention-days: 3
