name: Publish approved container
on:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orbit-tested-image
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact verified image
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          gunzip -c orbit-tested.tar.gz | docker load
          image="ghcr.io/${REPOSITORY,,}:sha-${REVISION}"
          docker tag orbit:local "$image"
          docker push "$image"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          printf 'Verified deployment image: `%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
