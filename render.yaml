# One online installation and one Neon database; personal data and demos are owner-scoped.
# Replace image.url with the exact digest printed by the verified GitHub release.
# Free services lack pre-deploy jobs: apply scripts/migrate-remote.sh before deployment.
services:
  - type: web
    name: orbit
    runtime: image
    plan: free
    region: oregon
    image:
      url: ghcr.io/replace-owner/orbit:replace-with-verified-digest
    healthCheckPath: /api/v1/health
    autoDeployTrigger: off
    envVars:
      - key: APP_MODE
        value: combined
      - key: DATABASE_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
