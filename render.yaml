# One online installation and one Neon database; personal data and demos are owner-scoped.
# Render builds the Dockerfile directly from main; no GitHub release or GHCR image is required.
# Free services lack pre-deploy jobs: apply scripts/migrate-remote.sh before deployment.
services:
  - type: web
    name: orbit
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_MODE
        value: combined
      - key: DATABASE_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
