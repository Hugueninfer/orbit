name: orbit
services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: orbit
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  migrate:
    image: orbit:local
    build: .
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://orbit:${POSTGRES_PASSWORD}@db:5432/orbit
      APP_MODE: ${APP_MODE:-combined}
      OIDC_AUTHORITY: ${OIDC_AUTHORITY:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-orbit-web}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-orbit-api}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_PROVIDER_URL: ${TELEGRAM_PROVIDER_URL:-}
      TELEGRAM_PROVIDER_KEY: ${TELEGRAM_PROVIDER_KEY:-}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  app:
    image: orbit:local
    environment:
      <<: *app-env
      PORT: "8080"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  keycloak:
    profiles: [identity]
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-admin-change-me}
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_PORT: "8081"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./infra/keycloak/orbit-realm.json:/opt/keycloak/data/import/orbit-realm.json:ro
      - keycloak_data:/opt/keycloak/data
volumes:
  postgres_data:
  keycloak_data:
